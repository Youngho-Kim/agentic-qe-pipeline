name: Agentic-QE CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  qe-e2e-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 3. Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. Install Playwright Chromium & OS Dependencies
        run: |
          python -m playwright install chromium --with-deps

      - name: 5. Run 5-Step Modular QE Pipeline (Headless CI)
        env:
          CI: "true"
        run: |
          python run_modular_qe_pipeline.py

      - name: 6. Upload QE Artifacts & Summary Excel Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qe-pipeline-artifacts
          path: artifacts/
          retention-days: 14